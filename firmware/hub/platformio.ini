; Hub (ESP32) and its host tests / simulator.
;   pio run -e hub -t upload --upload-port $HUB
;   pio test -e native
; The web app is built into src/web/app_gz.h by `npm run build` in web/.
[platformio]
default_envs = hub

[env]
lib_deps =
  symlink://../shared
  symlink://../node/lib/node_core
  bblanchon/ArduinoJson@^7.2.1

[env:hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  ESP32Async/AsyncTCP@^3.3.2
  ESP32Async/ESPAsyncWebServer@^3.6.0
build_flags =
  -Wall
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DWS_MAX_QUEUED_MESSAGES=24

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -g
