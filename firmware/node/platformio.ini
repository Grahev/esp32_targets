; Target node (ESP8266 Wemos D1 Mini) and its host tests.
;   pio run -e node -t upload --upload-port $NODE
;   pio test -e native
[platformio]
default_envs = node

[env]
lib_deps = symlink://../shared

[env:node]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
; 1 MB LittleFS (config only) leaves ~2 MB for OTA
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.2.1
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
